spring.application.name=bookstore-backend
server.port=8080

# Ket noi PostgreSQL 16 + pgvector (Docker container: bookstore-postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate chi kiem tra Entity khop voi 18 bang trong DB, KHONG tu xoa/tao bang
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cau hinh JWT (toi thieu 32 ky tu cho HMAC-SHA256)
app.jwt.secret=TriThucVietBookStoreSuperSecretKey2026ForJwtHs256Authentication!
app.jwt.expiration-ms=86400000

# Cau hinh CORS cho Mobile App (8081) va Web Admin (5173)
app.cors.allowed-origins=http://localhost:8081,http://localhost:5173,http://localhost:19006,http://localhost:3000

# Cau hinh tu dong hoan tat don DANG_GIAO qua han (Phuong an 2 - Scheduler)
# Mac dinh tat (false) de giu nguyen trang thai du lieu mau dh_03 khi demo/test;
# Khi muon bat auto-complete, doi enabled=true va chinh delay-minutes (vd: 4320 = 3 ngay, hoac 2 phut khi test nhanh)
app.order.auto-complete.enabled=false
app.order.auto-complete.delay-minutes=4320
app.order.auto-complete.scan-interval-ms=60000
app.order.auto-complete.initial-delay-ms=60000
